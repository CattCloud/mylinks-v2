<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erick Edison Verde — MyLinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg:        #ffffff;
      --border:    #1a1a1a;
      --shadow:    4px 4px 0px #1a1a1a;
      --shadow-sm: 3px 3px 0px #1a1a1a;

      --purple:    #b39ddb;
      --purple-bg: #d4c5f9;
      --yellow:    #ffe082;
      --cyan:      #b2ebf2;
      --green:     #a5d6a7;

      --btn-icon-y: #ffca28;
      --btn-icon-c: #80deea;
      --btn-icon-g: #66bb6a;

      --font-mono: 'Space Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }

    /* ─── BG GRID ────────────────────────────────────────────── */
    body {
      min-height: 100vh;
      background: radial-gradient(125% 125% at 50% 90%, #ffffff 40%, #d4c5f9 100%);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 64px;
    }

    /* ─── CARD ───────────────────────────────────────────────── */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      gap: 0;
    }

    /* ─── CONNECTOR LINE ─────────────────────────────────────── */
    .line {
      width: 2px;
      background: var(--border);
    }
    .line-short  { height: 24px; }
    .line-medium { height: 32px; }

    /* ─── AVATAR ─────────────────────────────────────────────── */
    .avatar-wrap {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #c9b9f5;
      flex-shrink: 0;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: linear-gradient(135deg, #c9b9f5 0%, #b39ddb 100%);
      color: var(--border);
      font-family: var(--font-mono);
      font-weight: 700;
    }

    /* ─── BIO BOX ────────────────────────────────────────────── */
    .bio-box {
      width: 100%;
      background: var(--purple-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 20px 24px;
      text-align: center;
    }
    .bio-box .name {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--border);
      letter-spacing: -.01em;
    }
    .bio-box .role {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: #5c4d88;
      margin-top: 4px;
    }
    .bio-box .bio {
      font-family: var(--font-body);
      font-size: .82rem;
      color: #3a3060;
      margin-top: 10px;
      line-height: 1.5;
    }

    /* ─── LINK BUTTON ────────────────────────────────────────── */
    .link-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      font-family: var(--font-mono);
      font-size: .88rem;
      font-weight: 400;
      color: var(--border);
      text-decoration: none;
    }
    .link-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
    }
    .link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }
    .link-btn .icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .btn-linkedin { background: var(--yellow); }
    .btn-github   { background: var(--cyan); }
    .btn-email    { background: var(--green); }
    .btn-whatsapp { background: #b8f5b0; }

    /* ─── ICON ROW ───────────────────────────────────────────── */
    .icon-row {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }
    .icon-sq {
      width: 52px;
      height: 52px;
      border: 2px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .icon-sq:hover {
      transform: translate(-2px,-2px);
      box-shadow: 5px 5px 0px var(--border);
    }
    .icon-sq:active {
      transform: translate(1px,1px);
      box-shadow: 1px 1px 0px var(--border);
    }
    .sq-y { background: var(--btn-icon-y); }
    .sq-c { background: var(--btn-icon-c); }
    .sq-g { background: var(--btn-icon-g); }

    /* ─── SVG ICONS ──────────────────────────────────────────── */
    .svg-icon { width: 20px; height: 20px; fill: var(--border); }

    /* ─── ANIMATIONS ─────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card > * {
      animation: fadeUp .4s ease both;
    }
    .card > *:nth-child(1)  { animation-delay: .05s; }
    .card > *:nth-child(2)  { animation-delay: .10s; }
    .card > *:nth-child(3)  { animation-delay: .15s; }
    .card > *:nth-child(4)  { animation-delay: .20s; }
    .card > *:nth-child(5)  { animation-delay: .25s; }
    .card > *:nth-child(6)  { animation-delay: .30s; }
    .card > *:nth-child(7)  { animation-delay: .35s; }
    .card > *:nth-child(8)  { animation-delay: .40s; }
    .card > *:nth-child(9)  { animation-delay: .45s; }
    .card > *:nth-child(10) { animation-delay: .50s; }
    .card > *:nth-child(11) { animation-delay: .55s; }
    .card > *:nth-child(12) { animation-delay: .60s; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (min-width: 600px) {
      .bio-box  { padding: 22px 32px; }
      .link-btn { font-size: .92rem; padding: 15px 22px; }
    }
  </style>
</head>
<body>

<main class="card" role="main">

  <!-- AVATAR -->
